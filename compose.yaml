name: university-management

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university
      POSTGRES_PASSWORD: ${DB_PASSWORD:-university123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/university_db
      DB_USERNAME: university
      DB_PASSWORD: ${DB_PASSWORD:-university123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JWT_SECRET: ${JWT_SECRET:?Run setup.ps1 to generate JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

