<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - University Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/login.js" defer></script>
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-panel">
        <div class="login-form-wrap">
            <h1>University Management System</h1>
            <h2>Login</h2>
            <div class="notice error" th:if="${param.error}" role="alert">Invalid email or password. Please try again.</div>
            <div class="notice success" th:if="${param.logout}" role="status">You have been signed out.</div>
            <div class="notice" th:if="${param.changed}" role="status">Your account changed. Please sign in again.</div>
            <div class="notice" th:if="${param.deleted}" role="status">Your account has been deleted.</div>
            <div class="notice" th:if="${param.expired}" role="status">Your login expired or your account changed. Please log in again.</div>
            <div id="login-error" class="notice error" role="alert" hidden></div>
            <form id="login-form" method="post" action="/api/auth/login" class="login-form">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="username" required autofocus maxlength="128">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button class="button primary login-submit" id="login-button" type="submit">Login</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
