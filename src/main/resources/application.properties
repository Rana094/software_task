spring.application.name=university-management
server.port=${PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university_db}
spring.datasource.username=${DB_USERNAME:university}
spring.datasource.password=${DB_PASSWORD:university123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}

